[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-forge"
version = "0.1.0"
description = "Adversarial agent harness."
requires-python = ">=3.11"
dependencies = ["anthropic>=0.40", "pydantic>=2"]

[project.scripts]
forge = "forge.run:main"

[project.optional-dependencies]
dev = ["pytest", "jsonschema>=4"]

[tool.setuptools]
packages = ["forge"]
